# Curated descriptions, keyed by fact path as shown on the site.
#
# - Top-level keys are written without the `ansible_` prefix.
# - Nested keys are dotted; list elements use `[]` (`mounts[].device`).
# - Any `<placeholder>` matches any placeholder at that position.
# - A value is either the description, or a table with `description` and/or `type`
#   (use `type` only where static analysis cannot know it).
# Facts without an entry get a description generated from their name.

[facts]
